<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Team Builder</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Pokémon Team Builder</h1>

    <div class="search-area">
        <input
            type="text"
            id="pokemonInput" 
            placeholder="Pokémon adı gir..."
        >    <!--jsye yazmamız lazım -->

        <button id="searchBtn"> <!--jsye yazmamız lazım -->
            Ara
        </button>
    </div>

    <div id="result"> <!--jsye yazmamız lazım -->
        <!-- Aranan Pokémon burada gösterilecek -->
    </div>

    <h2>Takımım</h2>

    <div id="team"><!--jsye yazmamız lazım -->
        <!-- Takımdaki Pokémonlar burada gösterilecek -->
    </div>

    <script src="script.js"></script>

</body>
</html>
